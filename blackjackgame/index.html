<!DOCTYPE html>
<head>
<link rel="stylesheet" href="style.css">
    <title>Blackjack Game</title>
</head>
<body><div class="container">
    <p class="blackjack">Blackjack Game</p>
    <p id="message-el">do you want to play a round?</p>
    <p id="score">Score: 0</p>
    <p id="cards">Cards: <span id="cards-el"></span></p>
    <p id="sum">Sum: <span id="sum-el">0</span></p>
    </div>
    <button id="start-btn" onclick="startgame()">Start Game</button>
    <button id="new-card-btn" onclick="newcard()">New Card</button>

    <script src="script.js"></script>

</body>
</html>
